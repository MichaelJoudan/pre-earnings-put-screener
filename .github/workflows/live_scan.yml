name: Pre-Earnings Screener — Calendar Refresh & On-Demand Scan

on:
  workflow_dispatch:
    inputs:
      full_ivol_scan:
        description: "Run full iVolatility API scan (set false to refresh only free Nasdaq/VIX calendar)"
        required: false
        default: "true"
        type: string
      as_of_date:
        description: "Optional YYYY-MM-DD override"
        required: false
        default: ""
        type: string
  schedule:
    # Daily schedule refreshes ONLY free Nasdaq earnings + VIX macro regime (0 iVolatility API calls!)
    - cron: "35 13 * * 1-5"
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: pre-earnings-screener-live
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Calendar (Zero iVol Quota on Schedule / Full Scan on Manual Trigger)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Free Nasdaq Calendar & VIX Regime (Scheduled — 0 iVolatility API Calls)
        if: github.event_name == 'schedule' || inputs.full_ivol_scan == 'false'
        run: |
          python scripts/update_free_calendar.py

      - name: Run Full On-Demand iVolatility Scan (Manual Dispatch Only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_ivol_scan != 'false'
        run: |
          python scripts/run_scan.py --as-of-date "${{ inputs.as_of_date }}"

      - name: Commit updated outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes in outputs."
          else
            git commit -m "chore(calendar): refresh pre-earnings calendar & regime [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
